<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: 'Plex Mono'; font-weight: 400; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2); }
  @font-face { font-family: 'Plex Condensed'; font-weight: 500; src: url(fonts/ibm-plex-sans-condensed-latin-500-normal.woff2); }
  html, body { margin: 0; }
  .card { width: 1280px; height: 640px; background: #171716; position: relative; overflow: hidden; font-family: 'Plex Condensed'; color: #E9E5DC; }
  .card svg.bg { position: absolute; inset: 0; }
  .text { position: absolute; left: 96px; top: 150px; width: 640px; }
  h1 { font: 500 64px/1.05 'Plex Condensed'; margin: 56px 0 0; letter-spacing: -0.01em; }
  p { font: 400 19px/1.6 'Plex Mono'; color: #9A958B; margin: 28px 0 0; letter-spacing: 0.02em; }
</style></head><body>
<div class="card">
  <svg class="bg" width="1280" height="640" viewBox="0 0 1280 640">
    <g stroke="#2D2B28" stroke-width="1.2">
      <line x1="560" y1="640" x2="1040" y2="300"/><line x1="760" y1="640" x2="1040" y2="300"/><line x1="960" y1="640" x2="1040" y2="300"/>
      <line x1="1160" y1="640" x2="1040" y2="300"/><line x1="1360" y1="640" x2="1040" y2="300"/><line x1="1560" y1="640" x2="1040" y2="300"/>
      <line x1="700" y1="340" x2="1280" y2="340"/><line x1="660" y1="400" x2="1280" y2="400"/><line x1="600" y1="500" x2="1280" y2="500"/>
    </g>
    <line x1="760" y1="300" x2="1280" y2="300" stroke="#5F5B54" stroke-width="1.2" stroke-dasharray="9 7"/>
    <g stroke="#E9E5DC" stroke-width="5" stroke-linecap="round">
      <line x1="800" y1="120" x2="984" y2="279"/><line x1="800" y1="420" x2="982" y2="320"/><line x1="800" y1="560" x2="990" y2="338"/>
    </g>
    <path d="M1040 276 L1064 300 L1040 324 L1016 300 Z" fill="none" stroke="#F5C518" stroke-width="4.5"/>
  </svg>
  <div class="text">
    <img src="logo/fuga-lockup-dark.svg" style="height:46px">
    <h1>Camera matching<br>from a single photo.</h1>
    <p>Free &amp; open source · Blender · Maya · USD</p>
  </div>
</div></body></html>
