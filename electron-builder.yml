appId: app.fuga.calibrate
productName: Fuga
artifactName: Fuga-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Electron fuses: switches compiled into the binary that turn off ways to
# misuse a shipped app (running it as plain Node, injecting code through
# NODE_OPTIONS or --inspect, loading code from outside the signed archive).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # Kept on: the UI is loaded from file://, which needs these privileges.
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true

fileAssociations:
  - ext: fuga
    name: Fuga project
    role: Editor

# Installers are attached to a *draft* GitHub release; publishing the draft is
# what makes the in-app update notice appear. Keep in sync with src/shared/release.ts.
publish:
  provider: github
  owner: fuga-app
  repo: fuga
  releaseType: draft

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
  # Free ad-hoc signature: required for Apple Silicon to launch the app at all.
  # Without a paid Apple Developer ID, users open it the first time with
  # right-click → Open (see docs/RELEASING.md).
  identity: '-'
  hardenedRuntime: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  # fSpy issue #150: let the user choose a per-machine install.
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Graphics
  syncDesktopName: true
